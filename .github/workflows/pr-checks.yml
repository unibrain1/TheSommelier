name: PR Checks

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main", "milestone/*"]

jobs:
  secrets-check:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

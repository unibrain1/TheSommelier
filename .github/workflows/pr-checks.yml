name: PR Checks

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["main", "milestone/*"]

jobs:
  secrets-check:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

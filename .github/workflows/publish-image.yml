# Builds the image for amd64 and arm64. A pull request only builds. A v* tag pushes
# X.Y.Z, X.Y and latest. A push to main or a milestone branch, or a manual run on a
# branch, pushes edge.
name: Publish image
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - nginx.conf
      - "*.sh"
      - "scripts/*.py"
      - "site/*.html"
      - "site/*.css"
      - "site/*.png"
      - "site/*.ico"
      - .github/workflows/publish-image.yml
  push:
    # A manual run needs the file on main, so a milestone branch pushes edge
    # itself. That gives the pre-release image before the file reaches main.
    branches: [main, "milestone/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Needed to push to GHCR. A pull request does not log in or push.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/unibrain1/thesommelier
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Claude Code Review

# Reviews each non-draft PR against CLAUDE.md. Posts line findings as inline
# comments. track_progress makes the action post a progress comment, and
# Claude puts the summary in it with the update tool. No gh pr comment call is
# needed, so a denied Bash command cannot lose the review. The last step fails the
# job if Claude posted no comment in this run, or if the review has content
# under "### Blocking". Same pattern as mock-brevo and MyGunLog.
#
# Skipped: draft PRs, Dependabot PRs (Dependabot runs get no secrets), and
# titles that contain [skip-review].
#
# Tool scope: Claude reads the PR only with gh, not with git. Repo git config
# can make git diff, log, or show run other programs. Claude can write only
# /tmp/claude-review.md. That is an Edit rule, because Edit rules cover the
# Write tool and a Write(path) rule never matches. "//" makes the path absolute.
#
# The action does not run when a PR changes this file (the PR copy differs
# from main). A person must review such a PR. The change takes effect after
# the merge.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, '[skip-review]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Claude reads the PR with gh. It does not need the checkout token.
          persist-credentials: false

      - name: Record run start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the project rules in CLAUDE.md.
            Read CLAUDE.md first. Get the diff with `gh pr diff`.

            Check these items:

            Pipeline and scripts:
            - Blocking: a script swallows an error instead of failing loudly.
            - Blocking: the JSON data contracts between scripts do not agree.
            - Blocking: the pipeline runs a step before the step it depends on.
            - Important: an error message goes to stdout instead of stderr.
            - Important: a broad exception catch hides a programming error.

            Security:
            - Blocking: a secret or credential can go into a log or the output.
            - Blocking: unsanitized input can cause command injection.
            - Important: a 1Password reference is used where a literal value is expected.

            Code quality:
            - Blocking: a script copies a shared utility from wine_utils.py.
            - Important: new functionality has no test.
            - Important: CLAUDE.md is not updated for a new script, env var or pipeline change.

            Output:
            1. For each finding on a specific line, post an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
               Put each inline finding in the summary too, under its heading,
               with the file and the line. The gate reads only the summary.
            2. Put one summary in the progress comment with
               `mcp__github_comment__update_claude_comment`. The action posted
               that comment for this run. Start the summary with the heading
               `## Claude review`. Then use these headings, and leave out each
               heading that has no content:
               - `### Blocking`: a bug, a security problem, or a break of a
                 CLAUDE.md rule. The job fails while this section has content.
               - `### Important`: a real risk, or a missing test or doc update.
               - `### Suggestions`: an optional improvement.
               - `### Strengths`: what the PR does well.
               If there are no findings, write only "No issues found." after the
               first heading. Do not write "None" under a heading.
            3. Only if the update tool fails: write the summary to
               `/tmp/claude-review.md` with the Write tool, and post it with this
               one-line command:

                 gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/claude-review.md

               Do not put the summary text in a command. A command with more
               than one line is denied. Put the summary in a comment before you
               end the turn.
            4. Report only findings that you checked in the code. Give the file
               and the line for each finding.

            Post only GitHub comments. Do not send the review as a message.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Edit(//tmp/claude-review.md),Grep,Glob"

      - name: Fail if no review was posted, or if it has Blocking findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          STARTED: ${{ steps.start.outputs.time }}
        run: |
          # Use only Claude comments from this run that have the summary
          # heading: normally the track_progress comment. A progress comment
          # that Claude did not fill, comments from earlier runs, from people,
          # and error comments do not count. Without a start time, the check
          # fails.
          if [ -z "$STARTED" ]; then
            echo "::error::No run start time. Cannot check for a review from this run."
            exit 1
          fi
          gh api --paginate "repos/${REPO}/issues/${PR_NUM}/comments" \
            --jq '.[] | select(.user.login == "claude[bot]") | select(.created_at >= env.STARTED) | select(.body | contains("Claude encountered an error") | not) | select(.body | contains("## Claude review")) | .body' \
            > "$RUNNER_TEMP/review.md"
          if [ ! -s "$RUNNER_TEMP/review.md" ]; then
            # The action does not run when this file on the PR head differs
            # from main. Give a warning only when that is the cause: no
            # execution file, and the two blob SHAs differ. An empty lookup
            # counts as no. A 404 on main means that this PR adds the file.
            WF_PATH='.github/workflows/claude-code-review.yml'
            MAIN_BLOB=$(gh api "repos/${REPO}/contents/${WF_PATH}?ref=main" --jq .sha 2>"$RUNNER_TEMP/main_err" || true)
            if [ -z "$MAIN_BLOB" ] && grep -q 'HTTP 404' "$RUNNER_TEMP/main_err"; then
              MAIN_BLOB=none
            fi
            HEAD_BLOB=$(gh api "repos/${REPO}/contents/${WF_PATH}?ref=${HEAD_SHA}" --jq .sha 2>/dev/null || true)
            if [ -z "$EXECUTION_FILE" ] && [ -n "$MAIN_BLOB" ] && [ -n "$HEAD_BLOB" ] \
               && [ "$MAIN_BLOB" != "$HEAD_BLOB" ]; then
              echo "::warning::No review posted. The action did not run, because ${WF_PATH} on this PR differs from main. A person must review this PR."
              exit 0
            fi
            echo "::error::No Claude comment with \"## Claude review\" from this run found on this PR (run started ${STARTED})."
            exit 1
          fi
          # The prompt says to leave out an empty section. It cannot make sure
          # of that, so an empty Blocking section ("None", "N/A", "No issues
          # found.") does not count.
          SECTION=$(awk '
            /^#{1,6}[[:space:]]+Blocking[[:space:]]*$/ { capture=1; next }
            /^#{1,6}[[:space:]]/ { capture=0 }
            capture { print }
          ' "$RUNNER_TEMP/review.md")
          NORMALIZED=$(echo "$SECTION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' | sed -E 's/^(none\.?|n\/a\.?|-|noissuesfound\.?)+$//')
          if [ -n "$NORMALIZED" ]; then
            echo "::error::Review posted Blocking findings. Fix them before merging; see the PR comment."
            exit 1
          fi
          echo "No Blocking findings in the review."

# App CI from devkit (docs/families.md, Family B). It runs the lint and the
# tests of the app on each PR and on each push to main and to a milestone
# branch. It does not publish the image: publish-image.yml does that. The
# docker-tests job builds the image and runs the opt-in tests of
# tests/test_docker_image.py.
name: CI
on:
  pull_request:
  push:
    branches: [main, "milestone/**"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  app:
    name: App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Python as the base image in the Dockerfile.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # ubuntu-24.04 has bash, curl, flock, jq and Docker. The e2e tests skip
      # without jq. The hadolint hook needs Docker.
      - run: pip install -r requirements.txt pytest pre-commit==4.7.0
      # The lint key of .claude/project.md. The test-quick hook needs the
      # local .venv, and the Test step runs the full suite, so CI skips it.
      - name: Lint
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: test-quick
      - name: Test
        run: python -m pytest tests/ -q --tb=short

  docker-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest
      # The tests build the image again under a tag of their own. This build
      # shows a build failure in its own step and fills the layer cache, so the
      # build in the tests is fast.
      - run: docker build -t sommelier-ci .
      # No SOMMELIER_CLAUDE_TEST_TOKEN: the test that needs it stays skipped.
      - run: python -m pytest tests/test_docker_image.py -q --tb=short
        env:
          SOMMELIER_DOCKER_TESTS: "1"

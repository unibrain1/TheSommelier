# Baseline Dependabot config from devkit (docs/baseline.md). It bumps the
# pinned actions one time each week, in one grouped PR. It does not bump
# the devkit callers: the devkit pin moves only by hand, at a milestone
# boundary (docs/ci-workflows.md, devkit pin rule).
# Each entry waits 7 days after a release (cooldown), so that a bad or
# compromised release can be found before Dependabot opens a PR for it.
# This repo adds a day and a time to each entry: Monday 04:00 Pacific, so
# the PRs are open before the Monday dashboard email.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: unibrain1/devkit
  # Family B (docs/families.md): bump the base images in the Dockerfile
  # one time each week, in one grouped PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ["*"]
    # This repo also skips Python minor and major versions. A new minor
    # version needs ci.yml and the digest guard test to change too, so the
    # project moves to it on purpose (issue #164). Digest and patch updates
    # of the current minor version still come.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  # The packages of the stack, one time each week, in one grouped PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      stack:
        patterns: ["*"]

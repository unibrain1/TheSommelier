# Generic file. Put host-specific settings (DNS, ports, reverse proxy labels,
# networks, the Home Assistant SSH key) in docker-compose.override.yml.
# See docker-compose.override.yml.sample.
services:
  the-sommelier:
    build: .
    container_name: the-sommelier
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      # Keep the files in the repo checkout. #112 removes these two lines when
      # it adds the /data volume.
      - DATA_DIR=/app/data
      - SITE_DIR=/app/site
      - SYNC_SCHEDULE=*/30 6-21 * * *;0 22 * * *
    volumes:
      - ./:/app
    restart: unless-stopped

  run-now:
    build: .
    container_name: the-sommelier-run
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      # Keep the files in the repo checkout. #112 removes these two lines when
      # it adds the /data volume.
      - DATA_DIR=/app/data
      - SITE_DIR=/app/site
    volumes:
      - ./:/app
    entrypoint: []
    command: ["bash", "/app/fetch_docker.sh"]
    profiles:
      - run-now

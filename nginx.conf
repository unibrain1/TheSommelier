# Main nginx config. The container runs as UID 1000 with a read-only root
# file system, so every file that nginx writes is in /tmp (a tmpfs).
# No "user" line: nginx is not root, so it cannot change user.
# The entrypoint starts nginx as a daemon, so "daemon off" is not set.

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr;

events {
    worker_connections 768;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    server_tokens off;

    # Every location inherits these headers. An add_header line in a location
    # removes all of the inherited ones, so do not put one there.
    # The pages use inline scripts, onclick handlers and inline styles, so the
    # CSP needs 'unsafe-inline'. digest.html is also a page of this site, and
    # its logo is a data: URL, so img-src allows data:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    # nginx creates each of these folders at start, but not their parent.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    tcp_nopush on;
    gzip on;

    server {
        listen 8080;
        server_name _;

        # Static files are in the image. Run output (plan.json, digest.html
        # and the others) is in the data volume. A file in the image wins.
        root /app/site;
        index index.html;

        location / {
            try_files $uri $uri/ @data;
        }

        # A regex location replaces the "/" location for .json requests, so it
        # needs its own @data fallback. plan.json is only in the data volume.
        location ~* \.json$ {
            default_type application/json;
            try_files $uri @data;
        }

        location @data {
            root /data/site;
            try_files $uri =404;
        }
    }
}
